name: Refresh Dashboards (Current Affairs + Railways)

# ── Triggers ────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths: ['current_affairs/**', 'indian_railways/**', '.github/workflows/current-affairs.yml']
  schedule:
    - cron: '30 */2 * * *'   # every 2 hours at :30 (e.g. 0:30, 2:30, 4:30 …)
  workflow_dispatch:   # manual "Run workflow" button in GitHub UI

# ── Permissions needed by actions/deploy-pages ────────────────────────────
permissions:
  contents: read
  pages: write
  id-token: write

# ── Only one deployment at a time ─────────────────────────────────────────
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Set up Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # 3. Install only what the orchestrator needs
      - name: Install dependencies
        run: pip install feedparser requests

      # 4. Restore cached news data (JSON + history JSONs) from previous run
      #    This lets maybe_archive() detect a date change and save yesterday's
      #    articles, and lets generate_static_pages() build history HTML.
      - name: Restore news cache
        uses: actions/cache/restore@v4
        with:
          path: |
            current_affairs/news/current_affairs_data.json
            current_affairs/news/history
          key: current-affairs-news-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            current-affairs-news-${{ runner.os }}-

      # 5. Fetch today's news and generate the main HTML
      - name: Generate current affairs HTML
        run: python -m current_affairs.orchestrator --workers 8
        timeout-minutes: 10

      # 6. Build static history HTML pages (prev/next/jump links all relative)
      - name: Generate static history pages
        run: |
          python -c "
          from current_affairs.history_agent import generate_static_pages
          generate_static_pages()
          "
        continue-on-error: true

      # 7. Save the updated cache (JSON + history) for the next run
      - name: Save news cache
        uses: actions/cache/save@v4
        with:
          path: |
            current_affairs/news/current_affairs_data.json
            current_affairs/news/history
          key: current-affairs-news-${{ runner.os }}-${{ github.run_number }}

      # 8. Make it the index page so the URL is clean (no /current_affairs_report.html)
      - name: Create index.html
        run: cp current_affairs/news/current_affairs_report.html current_affairs/news/index.html

      # 8b. Build the Railways tracker (static mode: curated ~56 trains only —
      #     the full ~2,400-train search needs the live Flask app, not Pages)
      #     and nest it under /railways/ in the same Pages site.
      - name: Generate Railways tracker HTML
        run: python -m indian_railways.orchestrator
        timeout-minutes: 5

      - name: Copy Railways tracker into Pages output
        run: |
          mkdir -p current_affairs/news/railways
          cp indian_railways/trains/railways_report.html current_affairs/news/railways/index.html

      # 9. Upload the news folder as the Pages artifact
      #    Includes: index.html, current_affairs_report.html, history/*.html, railways/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./current_affairs/news

      # 10. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
