name: Refresh Dashboards (Weather + Current Affairs + Railways + Markets + AQI + Gov Updates + Borders + Highways)

# ── Triggers ────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths: ['india_weather/**', 'current_affairs/**', 'indian_railways/**', 'stock_market/**', 'air_quality/**', 'gov_updates/**', 'india_borders/**', 'india_highways/**', 'abbreviations/**', 'short_news/**', 'static/**', '.github/workflows/current-affairs.yml']
  schedule:
    - cron: '30 */2 * * *'    # every 2 hours at :30 (e.g. 0:30, 2:30, 4:30 …) — baseline, all agents
    - cron: '*/15 3-10 * * 1-5'   # every 15 min, Mon-Fri ~8:30-15:30 IST (NSE 9:15-15:30 IST) — keeps Stock Market fresh
  workflow_dispatch:   # manual "Run workflow" button in GitHub UI

# ── Permissions needed by actions/deploy-pages ────────────────────────────
permissions:
  contents: read
  pages: write
  id-token: write

# ── Only one deployment at a time ─────────────────────────────────────────
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Set up Python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # 3. Install only what the orchestrator needs
      - name: Install dependencies
        run: pip install feedparser requests

      # 4. Restore cached news data (JSON + history JSONs) from previous run
      #    This lets maybe_archive() detect a date change and save yesterday's
      #    articles, and lets generate_static_pages() build history HTML.
      - name: Restore news cache
        uses: actions/cache/restore@v4
        with:
          path: |
            current_affairs/news/current_affairs_data.json
            current_affairs/news/history
          key: current-affairs-news-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            current-affairs-news-${{ runner.os }}-

      # 5. Fetch today's news and generate the main HTML
      - name: Generate current affairs HTML
        run: python -m current_affairs.orchestrator --workers 8
        timeout-minutes: 10

      # 6. Build static history HTML pages (prev/next/jump links all relative)
      - name: Generate static history pages
        run: |
          python -c "
          from current_affairs.history_agent import generate_static_pages
          generate_static_pages()
          "
        continue-on-error: true

      # 7. Save the updated cache (JSON + history) for the next run
      - name: Save news cache
        uses: actions/cache/save@v4
        with:
          path: |
            current_affairs/news/current_affairs_data.json
            current_affairs/news/history
          key: current-affairs-news-${{ runner.os }}-${{ github.run_number }}

      # 8. Build a static weather dashboard page.
      - name: Generate Weather dashboard HTML
        # The report generator supports a first deploy without cached weather
        # JSON; the orchestrator's --output html mode requires that cache.
        run: python -m india_weather.weather_report
        timeout-minutes: 5

      # 9. Make Current Affairs report the index for its own section.
      - name: Create Current Affairs index.html
        run: cp current_affairs/news/current_affairs_report.html current_affairs/news/index.html

      # 10. Build the Railways tracker (static mode: curated list in-page;
      #     full database search remains available in the standalone Flask app).
      - name: Generate Railways tracker HTML
        run: python -m indian_railways.orchestrator
        timeout-minutes: 5

      # 10a. Build the Stock Market snapshot HTML (free Yahoo Finance quotes).
      - name: Restore Stock Market history cache
        uses: actions/cache/restore@v4
        with:
          path: stock_market/market/history
          key: stock-market-history-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            stock-market-history-${{ runner.os }}-

      - name: Generate Stock Market HTML
        run: python -m stock_market.orchestrator --workers 8
        timeout-minutes: 5
        continue-on-error: true

      - name: Save Stock Market history cache
        uses: actions/cache/save@v4
        with:
          path: stock_market/market/history
          key: stock-market-history-${{ runner.os }}-${{ github.run_number }}
        continue-on-error: true

      # 10b. Build the Air Quality dashboard HTML (free Open-Meteo AQI data).
      - name: Restore AQI history cache
        uses: actions/cache/restore@v4
        with:
          path: air_quality/aqi/history
          key: air-quality-history-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            air-quality-history-${{ runner.os }}-

      - name: Generate Air Quality HTML
        run: python -m air_quality.orchestrator --workers 6
        timeout-minutes: 5
        continue-on-error: true

      - name: Save AQI history cache
        uses: actions/cache/save@v4
        with:
          path: air_quality/aqi/history
          key: air-quality-history-${{ runner.os }}-${{ github.run_number }}
        continue-on-error: true

      # 10c. Build the Government Schemes & Exam Tracker HTML (free news RSS).
      - name: Generate Gov Updates HTML
        run: python -m gov_updates.orchestrator
        timeout-minutes: 5
        continue-on-error: true

      # 10d. Build India Borders Atlas (fully static curated geography data, no API).
      - name: Generate India Borders HTML
        run: python -m india_borders.orchestrator
        timeout-minutes: 2
        continue-on-error: true

      # 10e. Build India Highways (fully static curated MoRTH/NHAI reference data, no API).
      - name: Generate India Highways HTML
        run: python -m india_highways.orchestrator
        timeout-minutes: 2
        continue-on-error: true

      # 10f. Build The Lexicon / Abbreviations (fully static curated general-reference data, no API).
      - name: Generate Abbreviations HTML
        run: python -m abbreviations.orchestrator
        timeout-minutes: 2
        continue-on-error: true

      # 10g. Build Short News / Quick Read (crisp ~60-word story digest, free RSS, no API key).
      - name: Generate Short News HTML
        run: python -m short_news.orchestrator --workers 6
        timeout-minutes: 5
        continue-on-error: true

      # 11. Assemble a single Pages artifact with ten independent sections.
      - name: Assemble multi-app Pages artifact
        run: |
          rm -rf site
          mkdir -p site/weather/static site/current-affairs site/railways site/stock-market site/air-quality site/gov-updates site/borders site/highways site/abbreviations site/short-news

          cp india_weather/weathers/india_weather_report.html site/weather/index.html
          cp static/manifest.json site/weather/manifest.json
          cp static/sw.js site/weather/sw.js
          cp static/icon-192.png site/weather/static/icon-192.png
          cp static/icon-512.png site/weather/static/icon-512.png

          cp -r current_affairs/news/. site/current-affairs/
          cp indian_railways/trains/railways_report.html site/railways/index.html
          cp indian_railways/trains/railway_history.html site/railways/history.html

          [ -f stock_market/market/stock_market_report.html ] && cp stock_market/market/stock_market_report.html site/stock-market/index.html
          [ -f air_quality/aqi/air_quality_report.html ] && cp air_quality/aqi/air_quality_report.html site/air-quality/index.html
          [ -f gov_updates/updates/gov_updates_report.html ] && cp gov_updates/updates/gov_updates_report.html site/gov-updates/index.html
          [ -f india_borders/borders/india_borders_report.html ] && cp india_borders/borders/india_borders_report.html site/borders/index.html
          [ -f india_highways/network/india_highways_report.html ] && cp india_highways/network/india_highways_report.html site/highways/index.html
          [ -f abbreviations/lexicon/abbreviations_report.html ] && cp abbreviations/lexicon/abbreviations_report.html site/abbreviations/index.html
          [ -f short_news/digest/short_news_report.html ] && cp short_news/digest/short_news_report.html site/short-news/index.html

          cat > site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>India Agents Hub</title>
            <style>
              :root {
                --bg: #f2efe9;
                --ink: #1f2937;
                --muted: #6b7280;
                --card: #fffdf8;
                --line: #d6d1c4;
                --accent1: #0ea5e9;
                --accent2: #f97316;
                --accent3: #16a34a;
                --accent4: #22c55e;
                --accent5: #0284c7;
                --accent6: #be123c;
                --accent7: #7c3aed;
                --accent8: #ca8a04;
                --accent9: #6e1f3a;
                --accent10: #ff5e57;
              }
              * { box-sizing: border-box; }
              body {
                margin: 0;
                font-family: Georgia, "Times New Roman", serif;
                color: var(--ink);
                background:
                  radial-gradient(circle at 10% 10%, #fff 0%, transparent 35%),
                  radial-gradient(circle at 90% 0%, #fff7ed 0%, transparent 30%),
                  linear-gradient(180deg, #f9f6ee 0%, var(--bg) 100%);
                min-height: 100vh;
              }
              .wrap { max-width: 1000px; margin: 0 auto; padding: 48px 20px 64px; }
              h1 { margin: 0 0 10px; font-size: clamp(2rem, 5vw, 3rem); letter-spacing: .02em; }
              p { margin: 0; color: var(--muted); font-size: 1.05rem; }
              .grid {
                margin-top: 30px;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 16px;
              }
              .card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 16px;
                padding: 18px;
                text-decoration: none;
                color: inherit;
                box-shadow: 0 10px 20px rgba(0,0,0,.05);
                transition: transform .2s ease, box-shadow .2s ease;
              }
              .card:hover { transform: translateY(-4px); box-shadow: 0 14px 26px rgba(0,0,0,.1); }
              .card h2 { margin: 0 0 6px; font-size: 1.35rem; }
              .chip {
                display: inline-block;
                padding: 3px 10px;
                border-radius: 999px;
                color: #fff;
                font-size: .74rem;
                margin-bottom: 10px;
              }
              .c1 { background: var(--accent1); }
              .c2 { background: var(--accent2); }
              .c3 { background: var(--accent3); }
              .c4 { background: var(--accent4); }
              .c5 { background: var(--accent5); }
              .c6 { background: var(--accent6); }
              .c7 { background: var(--accent7); }
              .c8 { background: var(--accent8); }
              .c9 { background: var(--accent9); }
              .c10 { background: var(--accent10); }
            </style>
          </head>
          <body>
            <main class="wrap">
              <h1>India Agent Dashboards</h1>
              <p>Ten independent dashboards, refreshed automatically every 2 hours (Stock Market every 15 min during NSE hours).</p>
              <section class="grid">
                <a class="card" href="./weather/">
                  <span class="chip c1">Weather</span>
                  <h2>India Weather</h2>
                  <p>State and district weather with alerts and live client refresh.</p>
                </a>
                <a class="card" href="./current-affairs/">
                  <span class="chip c2">Current Affairs</span>
                  <h2>Daily News Digest</h2>
                  <p>Category-wise news feed with archived history navigation.</p>
                </a>
                <a class="card" href="./railways/">
                  <span class="chip c3">Railways</span>
                  <h2>Train Tracker</h2>
                  <p>Train status dashboard with number, name, and route views.</p>
                </a>
                <a class="card" href="./stock-market/">
                  <span class="chip c4">Markets</span>
                  <h2>Stock Market Snapshot</h2>
                  <p>Nifty, Sensex &amp; Bank Nifty plus curated NSE large-cap movers.</p>
                </a>
                <a class="card" href="./air-quality/">
                  <span class="chip c5">Air Quality</span>
                  <h2>India AQI Dashboard</h2>
                  <p>Live air quality for 32 major cities with US EPA AQI bands.</p>
                </a>
                <a class="card" href="./gov-updates/">
                  <span class="chip c6">Government</span>
                  <h2>Schemes &amp; Exam Tracker</h2>
                  <p>Scheme announcements, exam news and a curated notification calendar.</p>
                </a>
                <a class="card" href="./borders/">
                  <span class="chip c7">Geography</span>
                  <h2>India Borders Atlas</h2>
                  <p>Every state/UT's land neighbours, bordering countries and coastline.</p>
                </a>
                <a class="card" href="./highways/">
                  <span class="chip c8">Infrastructure</span>
                  <h2>India Highways</h2>
                  <p>Major National Highway corridors, state-highway shares &amp; road network stats.</p>
                </a>
                <a class="card" href="./abbreviations/">
                  <span class="chip c9">Reference</span>
                  <h2>The Lexicon</h2>
                  <p>A searchable general reference of common abbreviations across government, finance, tech, science &amp; more.</p>
                </a>
                <a class="card" href="./short-news/">
                  <span class="chip c10">Quick Read</span>
                  <h2>Short News</h2>
                  <p>Every story condensed to ~60 words &mdash; the full picture, in seconds.</p>
                </a>
              </section>
              <p style="margin-top:40px;font-size:.8rem;opacity:.65">Built by Naveen Alla</p>
            </main>
          </body>
          </html>
          HTML

      # 12. Upload the multi-app static artifact.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # 13. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
